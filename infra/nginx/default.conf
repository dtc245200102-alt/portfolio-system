map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

log_format portfolio '$remote_addr - $request_method $uri $server_protocol $status $body_bytes_sent $request_time';
access_log /var/log/portfolio/nginx/access.log portfolio;
error_log /var/log/portfolio/nginx/error.log warn;
server_tokens off;

server {
    listen 8080;
    server_name localhost;
    return 308 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    server_name localhost;
    charset utf-8;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    root /var/www/html/public;
    index index.php;
    client_max_body_size 3m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_pass app:9000;
        fastcgi_read_timeout 60s;
    }

    location ~* /\.(?!well-known) {
        deny all;
    }
}

server {
    listen 8081;
    server_name _;
    access_log off;
    location = /nginx_status {
        stub_status;
        allow all;
    }
    location / { return 404; }
}
