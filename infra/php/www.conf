[www]
user = www-data
group = www-data
listen = 9000
listen.allowed_clients = any
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /var/log/portfolio/app/php-fpm-access.log
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/portfolio/app/php_errors.log
security.limit_extensions = .php
request_terminate_timeout = 60s
